# Common SWD config for STM32G4 via J-Link
# Shared by all board configs — override adapter serial in board-specific cfg

adapter driver jlink
transport select swd
adapter speed 1000

# STM32G431CB target
set CHIPNAME stm32g431
set ENDIAN little
source [find target/stm32g4x.cfg]

# Workarea for flash programming
set WORKAREASIZE 0x5000