# OpenOCD config for one probe — TEMPLATE
# Copy to openocd/<probe-name>.cfg, set your adapter serial and target.
# Keep it self-contained (no sourcing siblings): manage_debug passes exactly
# this file via `openocd -f`.

# Pick the interface driver matching your probe
source [find interface/jlink.cfg]
# For ST-Link: source [find interface/stlink.cfg]
# For CMSIS-DAP: source [find interface/cmsis-dap.cfg]

# One config per physical probe — serial disambiguates multiple adapters
adapter serial 000000000000
transport select swd

# Target: example is STM32G4; find yours in /usr/share/openocd/scripts/target/
source [find target/stm32g4x.cfg]

adapter speed 1000
