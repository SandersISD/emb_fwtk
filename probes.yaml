# emb_fwtk probe configuration
# Edit this file to match your hardware setup.
# This file is bind-mounted at container runtime — no rebuild needed after changes.

# Optional: shift all auto-assigned ports by this offset.
# Use when running multiple containers under --network host to avoid collisions.
port_offset: 0

probes:
  board-a:
    serial: "000770593783"
    role: "emitter"
    # Path to OpenOCD config, relative to this file's directory
    openocd_config: "openocd/board-a.cfg"
    # Optional port overrides — omit for auto-assignment
    # ports:
    #   telnet: 4444
    #   gdb: 3333
    #   remote: 19020

  board-b:
    serial: "000775604909"
    role: "receiver"
    openocd_config: "openocd/board-b.cfg"
    # NOTE: JLinkRemoteServer binds BOTH <port> and <port>+1 (loopback).
    # Consecutive remote ports collide — board-a's server would grab 19021.
    ports:
      telnet: 4445
      gdb: 3334
      remote: 19022